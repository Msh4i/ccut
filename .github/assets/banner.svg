<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-labelledby="t">
	<title id="t">Ccut: the open-source video editor</title>
	<rect width="1280" height="440" rx="28" fill="#111111"/>

	<!-- logo lockup: Cut Lime symbol, white wordmark -->
	<g transform="translate(447 46) scale(0.55) translate(-32 -20)">
		<g transform="translate(12 0)" fill="#C6F13A">
			<path d="M210.73 197.42 A108 108 0 1 1 210.73 58.58 L186.22 79.15 A76 76 0 1 0 186.22 176.85 Z"/>
			<path d="M164.77 164.77 A52 52 0 1 1 164.77 91.23 L147.8 108.2 A28 28 0 1 0 147.8 147.8 Z"/>
		</g>
		<g transform="translate(265.73 0)" fill="#FFFFFF">
			<path d="M140.16 174.28 A72 72 0 1 1 140.16 81.72 L120.24 98.43 A46 46 0 1 0 120.24 157.57 Z"/>
			<path d="M244.93 182.85 A48 48 0 1 1 244.93 121.15 L225.01 137.86 A22 22 0 1 0 225.01 166.14 Z"/>
			<path d="M266.93 104 H292.93 V152 A22 22 0 0 0 336.93 152 V104 H362.93 V152 A48 48 0 0 1 266.93 152 Z"/>
			<path d="M404.93 70 H430.93 V104 H464.93 V130 H430.93 V160 A14 14 0 0 0 444.93 174 H466.93 V200 H444.93 A40 40 0 0 1 404.93 160 V130 H380.93 V104 H404.93 Z"/>
		</g>
	</g>

	<text x="640" y="208" text-anchor="middle" fill="#A1A1A6" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" letter-spacing="0.5">Edit like CapCut. Own it like open source.</text>

	<!-- timeline -->
	<g transform="translate(96 252)">
		<!-- ruler + beat markers -->
		<rect width="1088" height="1" y="0" fill="#2C2C30"/>
		<g fill="#C6F13A">
			<rect x="68" y="-6" width="2" height="12" rx="1"/>
			<rect x="204" y="-6" width="2" height="12" rx="1"/>
			<rect x="340" y="-6" width="2" height="12" rx="1"/>
			<rect x="476" y="-6" width="2" height="12" rx="1"/>
			<rect x="612" y="-6" width="2" height="12" rx="1"/>
			<rect x="748" y="-6" width="2" height="12" rx="1"/>
			<rect x="884" y="-6" width="2" height="12" rx="1"/>
			<rect x="1020" y="-6" width="2" height="12" rx="1"/>
		</g>
		<!-- effect track -->
		<rect x="204" y="20" width="408" height="22" rx="6" fill="#C6F13A" opacity="0.9"/>
		<rect x="748" y="20" width="272" height="22" rx="6" fill="#C6F13A" opacity="0.55"/>
		<!-- video track -->
		<rect x="0" y="52" width="340" height="44" rx="8" fill="#2A2A2E"/>
		<rect x="346" y="52" width="266" height="44" rx="8" fill="#323236"/>
		<rect x="618" y="52" width="470" height="44" rx="8" fill="#2A2A2E"/>
		<!-- overlay track -->
		<rect x="136" y="106" width="204" height="30" rx="7" fill="#1F1F23" stroke="#3A3A3F"/>
		<rect x="680" y="106" width="250" height="30" rx="7" fill="#1F1F23" stroke="#3A3A3F"/>
		<!-- audio waveform -->
		<g fill="#5A5A60">
			<rect x="0" y="146" width="1088" height="1"/>
		</g>
		<g fill="#C6F13A" opacity="0.35">
			<rect x="68" y="146" width="6" height="26" rx="2"/><rect x="80" y="146" width="6" height="16" rx="2"/><rect x="92" y="146" width="6" height="9" rx="2"/>
			<rect x="204" y="146" width="6" height="26" rx="2"/><rect x="216" y="146" width="6" height="16" rx="2"/><rect x="228" y="146" width="6" height="9" rx="2"/>
			<rect x="340" y="146" width="6" height="26" rx="2"/><rect x="352" y="146" width="6" height="16" rx="2"/><rect x="364" y="146" width="6" height="9" rx="2"/>
			<rect x="476" y="146" width="6" height="26" rx="2"/><rect x="488" y="146" width="6" height="16" rx="2"/><rect x="500" y="146" width="6" height="9" rx="2"/>
			<rect x="612" y="146" width="6" height="26" rx="2"/><rect x="624" y="146" width="6" height="16" rx="2"/><rect x="636" y="146" width="6" height="9" rx="2"/>
			<rect x="748" y="146" width="6" height="26" rx="2"/><rect x="760" y="146" width="6" height="16" rx="2"/><rect x="772" y="146" width="6" height="9" rx="2"/>
			<rect x="884" y="146" width="6" height="26" rx="2"/><rect x="896" y="146" width="6" height="16" rx="2"/><rect x="908" y="146" width="6" height="9" rx="2"/>
			<rect x="1020" y="146" width="6" height="26" rx="2"/><rect x="1032" y="146" width="6" height="16" rx="2"/><rect x="1044" y="146" width="6" height="9" rx="2"/>
		</g>
		<!-- playhead -->
		<g>
			<rect x="-1" y="-12" width="2" height="196" fill="#FFFFFF"/>
			<circle cx="0" cy="-12" r="6" fill="#FFFFFF"/>
			<animateTransform attributeName="transform" type="translate" values="0 0; 1088 0" dur="8s" repeatCount="indefinite"/>
		</g>
	</g>
</svg>
